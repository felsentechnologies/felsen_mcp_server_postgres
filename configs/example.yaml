server:
  host: 127.0.0.1
  port: 8080
  endpoint: /mcp
  public_base_url: http://127.0.0.1:8080
  citation_signing_key_env: MCP_CITATION_SIGNING_KEY
  citation_ttl: 15m
  query_timeout: 30s
  session_timeout: 30m
  max_rows: 100
  max_search_results: 100
  max_body_bytes: 1048576
  max_concurrent_requests: 64
  json_response: true
  stateless: true

auth:
  api_keys:
    - name: reader
      token_env: MCP_API_KEY
      scopes: [read]
      connections: [default]
  # Optional environment principals are added when their token variables are
  # set: MCP_WRITER_API_KEY, MCP_DDL_API_KEY, MCP_ADMIN_API_KEY.

oauth:
  enabled: false
  signing_key_env: MCP_OAUTH_SIGNING_KEY
  username_env: MCP_OAUTH_USERNAME
  password_env: MCP_OAUTH_PASSWORD
  principal: reader
  client_id: felsen-chatgpt
  # Exact ChatGPT callback URL(s); MCP_OAUTH_CALLBACK_URL overrides this list.
  redirect_uris: []
  client_store_path_env: MCP_OAUTH_CLIENT_STORE_PATH
  default_scopes: [read]
  base_scopes: [read]
  access_token_ttl: 1h
  refresh_token_ttl: 720h
  authorization_code_ttl: 5m

connections:
  default:
    dsn_env: DATABASE_URL
    schemas: [public]
    max_rows: 100
    max_affected_rows: 100
    max_conns: 8
    query_timeout: 30s
    ddl_enabled: false
    masking:
      enabled: true

audit:
  destination: stdout
