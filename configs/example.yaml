server:
  host: 127.0.0.1
  port: 8080
  endpoint: /mcp
  query_timeout: 10s
  session_timeout: 30m
  max_rows: 100
  json_response: false
  stateless: false

auth:
  api_keys:
    - name: local-reader
      token_env: MCP_API_KEY
      scopes: [read]
      connections: [crm]
    - name: local-writer
      token_env: MCP_WRITER_API_KEY
      scopes: [read, write]
      connections: [crm]

connections:
  crm:
    dsn_env: CRM_DATABASE_URL
    schemas: [public]
    max_rows: 100
    query_timeout: 10s
    masking:
      sensitive_columns:
        - (?i)customer_document
      allow_columns: []
    dml_policies:
      - schema: public
        table: customers
        operations: [insert, update]

audit:
  destination: stdout
