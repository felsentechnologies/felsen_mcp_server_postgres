server:
  host: 127.0.0.1
  port: 8080
  endpoint: /mcp
  query_timeout: 30s
  session_timeout: 30m
  max_rows: 500
  json_response: true
  stateless: true

auth:
  api_keys:
    - name: admin
      token_env: MCP_API_KEY
      scopes: [admin]
      connections: [default]

connections:
  default:
    dsn_env: DATABASE_URL
    schemas: ["*"]
    max_rows: 500
    query_timeout: 30s
    ddl_enabled: true
    masking:
      enabled: false
    dml_policies:
      - schema: "*"
        table: "*"
        operations: [insert, update, delete]

audit:
  destination: stdout