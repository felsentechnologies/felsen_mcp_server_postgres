services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  postgres-mcp:
    image: ${IMAGE_NAME:-mcp-postgres}:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: Docker/Dockerfile
      args:
        VERSION_OVERRIDE: ${MCP_VERSION:-}
        BUILD_COMMIT: ${MCP_COMMIT:-unknown}
        BUILD_DATE: ${MCP_BUILD_DATE:-unknown}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_MCP_CONFIG: ${POSTGRES_MCP_CONFIG:-/app/Docker/config.docker.yaml}
      MCP_PUBLIC_BASE_URL: ${MCP_PUBLIC_BASE_URL:-http://localhost:8080}
      MCP_CITATION_SIGNING_KEY: ${MCP_CITATION_SIGNING_KEY:?MCP_CITATION_SIGNING_KEY is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      MCP_API_KEY: ${MCP_API_KEY:?MCP_API_KEY is required}
      MCP_OAUTH_ENABLED: ${MCP_OAUTH_ENABLED:-false}
      MCP_OAUTH_ISSUER: ${MCP_OAUTH_ISSUER:-}
      MCP_OAUTH_RESOURCE: ${MCP_OAUTH_RESOURCE:-}
      MCP_OAUTH_SIGNING_KEY: ${MCP_OAUTH_SIGNING_KEY:-}
      MCP_OAUTH_USERNAME: ${MCP_OAUTH_USERNAME:-}
      MCP_OAUTH_PASSWORD: ${MCP_OAUTH_PASSWORD:-}
      MCP_OAUTH_PRINCIPAL: ${MCP_OAUTH_PRINCIPAL:-reader}
      MCP_OAUTH_CLIENT_ID: ${MCP_OAUTH_CLIENT_ID:-felsen-chatgpt}
      MCP_OAUTH_CALLBACK_URL: ${MCP_OAUTH_CALLBACK_URL:-}
      MCP_OAUTH_CLIENT_STORE_PATH: ${MCP_OAUTH_CLIENT_STORE_PATH:-/app/data/oauth-clients.json}
    volumes:
      - oauth-client-data:/app/data
    ports:
      - "${HTTP_PORT:-${POSTGRES_MCP_PORT:-8080}}:8080"
    restart: unless-stopped

volumes:
  postgres-data:
  oauth-client-data:
