server:
  host: 0.0.0.0
  port: 8080
  endpoint: /mcp
  public_base_url: http://localhost:8080
  citation_signing_key_env: MCP_CITATION_SIGNING_KEY
  citation_ttl: 15m
  query_timeout: 30s
  session_timeout: 30m
  max_rows: 100
  max_search_results: 100
  # Allows an attached SQL import script to be sent as MCP tool content.
  max_body_bytes: 8388608
  max_concurrent_requests: 64
  json_response: true
  stateless: true

auth:
  api_keys:
    - name: reader
      token_env: MCP_API_KEY
      scopes: [read]
      connections: [default]
  # Optional environment principals are added when their token variables are
  # set: MCP_WRITER_API_KEY, MCP_DDL_API_KEY, MCP_ADMIN_API_KEY.

# OAuth 2.1 is disabled by default for local Compose. Enable it in the
# environment for the ChatGPT connector and provide the secret values below.
oauth:
  enabled: false
  signing_key_env: MCP_OAUTH_SIGNING_KEY
  username_env: MCP_OAUTH_USERNAME
  password_env: MCP_OAUTH_PASSWORD
  principal: admin
  client_id: felsen-chatgpt
  # Exact ChatGPT callback URL(s); MCP_OAUTH_CALLBACK_URL overrides this list.
  redirect_uris: []
  client_store_path_env: MCP_OAUTH_CLIENT_STORE_PATH
  default_scopes: [read, write, ddl, admin]
  base_scopes: [read, write, ddl, admin]
  access_token_ttl: 1h
  refresh_token_ttl: 720h
  authorization_code_ttl: 5m

connections:
  default:
    dsn_env: DATABASE_URL
    schemas: [public]
    max_rows: 100
    max_affected_rows: 100
    # Atomic execute_script import limits. These are separate from the
    # single-statement DML limit so a multi-row import can be applied safely.
    max_script_statements: 10000
    max_script_affected_rows: 10000
    max_script_bytes: 8388608
    max_conns: 8
    query_timeout: 30s
    # DDL and wildcard DML are enabled by default for the configured schemas.
    # Set MCP_DDL_ENABLED=false or MCP_DML_ENABLED=false to disable them.
    ddl_enabled: true
    dml_policies:
      - schema: "*"
        table: "*"
        operations: [insert, update, delete]
    masking:
      enabled: true

audit:
  destination: stdout
