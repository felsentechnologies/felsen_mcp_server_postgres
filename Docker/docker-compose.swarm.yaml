services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    networks:
      - mcp-network

  postgres-mcp:
    image: ${IMAGE_NAME:-mcp-postgres}:${IMAGE_TAG:-latest}
    environment:
      POSTGRES_MCP_CONFIG: ${POSTGRES_MCP_CONFIG:-/app/Docker/config.docker.yaml}
      MCP_PUBLIC_BASE_URL: ${MCP_PUBLIC_BASE_URL:?MCP_PUBLIC_BASE_URL is required in production}
      MCP_CITATION_SIGNING_KEY: ${MCP_CITATION_SIGNING_KEY:?MCP_CITATION_SIGNING_KEY is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      MCP_API_KEY: ${MCP_API_KEY:?MCP_API_KEY is required}
    ports:
      - "${HTTP_PORT:-${POSTGRES_MCP_PORT:-8080}}:8080"
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 5s
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    networks:
      - mcp-network

volumes:
  postgres-data:

networks:
  mcp-network:
    driver: overlay
