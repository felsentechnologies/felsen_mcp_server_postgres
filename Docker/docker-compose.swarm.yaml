services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mcp}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    networks:
      - mcp-network

  postgres-mcp:
    image: ${IMAGE_NAME:-mcp-postgres}:latest
    environment:
      POSTGRES_MCP_CONFIG: ${POSTGRES_MCP_CONFIG:-/app/Docker/config.docker.yaml}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-mcp}?sslmode=disable
      MCP_API_KEY: ${MCP_API_KEY:-${MCP_BEARER_TOKEN:-${HTTP_BEARER_TOKEN:-change-me-reader}}}
      MCP_WRITER_API_KEY: ${MCP_WRITER_API_KEY:-${MCP_BEARER_TOKEN:-${HTTP_BEARER_TOKEN:-change-me-writer}}}
      MCP_DDL_API_KEY: ${MCP_DDL_API_KEY:-${MCP_BEARER_TOKEN:-${HTTP_BEARER_TOKEN:-change-me-ddl}}}
      POSTGRES_MCP_API_KEY: ${POSTGRES_MCP_API_KEY:-${MCP_API_KEY:-change-me-reader}}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
    ports:
      - "${HTTP_PORT:-${POSTGRES_MCP_PORT:-8080}}:8080"
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 5s
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    networks:
      - mcp-network

volumes:
  postgres-data:

networks:
  mcp-network:
    driver: overlay
