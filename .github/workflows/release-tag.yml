name: Create release tag

on:
  push:
    branches: ["main"]
    paths:
      - "VERSION"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate semantic version
        id: version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "VERSION must contain a stable semantic version such as 1.2.3" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Create or verify release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
            existing_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
            if [[ "$existing_sha" == "$COMMIT_SHA" ]]; then
              echo "$RELEASE_TAG already points to $COMMIT_SHA"
              exit 0
            fi
            echo "$RELEASE_TAG already exists at $existing_sha; bump VERSION before releasing another commit" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$RELEASE_TAG" --message "Release $RELEASE_TAG" "$COMMIT_SHA"
          git push origin "$RELEASE_TAG"
